apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-world
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/arushi-gupta1111/eks-hello-world.git
    targetRevision: main                                                               #'tracks the main branch
    path: kubernetes
  destination:
    server: https://kubernetes.default.svc                       #	Targets the Kubernetes cluster where Argo CD runs.
    namespace: hello-world1
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
